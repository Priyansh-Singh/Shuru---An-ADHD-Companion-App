name: Shuru
options:
  bundleIdPrefix: io.github.priyanshsingh
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Shuru:
    type: application
    platform: iOS
    sources:
      - path: Shuru
    scheme: {}
    info:
      path: Shuru/Info.plist
      properties:
        CFBundleDisplayName: Shuru
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLName: io.github.priyanshsingh.shuru
            CFBundleURLSchemes:
              - shuru
        NSLocationWhenInUseUsageDescription: Shuru uses your location only to notice when you arrive somewhere you picked, like home, so it can start that routine. It never leaves your phone.
        NSLocationAlwaysAndWhenInUseUsageDescription: Choose Always so Shuru can start your “When I get home” routines even when the app is closed. Your location never leaves your phone.
        LSApplicationQueriesSchemes:
          - instagram
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.priyanshsingh.shuru
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
