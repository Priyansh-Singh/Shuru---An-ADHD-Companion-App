name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick version number
        run: |
          BASE=$(grep -m1 MARKETING_VERSION project.yml | sed -E 's/[^0-9]*([0-9]+)\.([0-9]+).*/\1.\2/')
          echo "APP_VERSION=$BASE.${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "Version: $BASE.${{ github.run_number }}"

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Shuru.xcodeproj \
            -scheme Shuru \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            MARKETING_VERSION="$APP_VERSION" \
            build 2>&1 | tee build.log | grep -E "error:|\*\* BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log
          test -f build/Build/Products/Release-iphoneos/Shuru.app/Shuru

      - name: Show compile errors
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -150 || true

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Shuru.app Payload/
          zip -qry Shuru.ipa Payload
          ls -la Shuru.ipa

      - name: Write SideStore source
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          RELEASE_NOTES: ${{ github.event.head_commit.message }}
        run: python3 scripts/make_source.py Shuru.ipa

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shuru-ipa
          path: Shuru.ipa

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          REPO_URL="https://github.com/${{ github.repository }}"
          {
            echo "${COMMIT_MSG:-New build.}"
            echo
            echo "---"
            echo "Unsigned build ${{ github.run_number }} of commit ${GITHUB_SHA::7}. Install it with SideStore, AltStore or LiveContainer, which sign it with your own Apple ID."
            echo
            echo "SideStore / AltStore source: $REPO_URL/releases/latest/download/source.json"
          } > notes.md

          # One release per version, marked as the latest.
          gh release create "v$APP_VERSION" Shuru.ipa source.json \
            --title "Shuru $APP_VERSION" \
            --notes-file notes.md \
            --target "$GITHUB_SHA" \
            --latest

          # Rolling copy under the old "latest" tag, so links added before versioned releases keep working.
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Shuru.ipa source.json \
            --title "Rolling build (for older links)" \
            --notes "Same as Shuru $APP_VERSION. Kept so older links keep working; use $REPO_URL/releases/latest instead." \
            --target "$GITHUB_SHA" \
            --prerelease
