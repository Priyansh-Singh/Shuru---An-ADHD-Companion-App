name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Shuru.xcodeproj \
            -scheme Shuru \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: unre|\*\* BUILD" || true
          test -d build/Build/Products/Release-iphoneos/Shuru.app

      - name: Show compile errors
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -150 || true

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Shuru.app Payload/
          zip -qry Shuru.ipa Payload
          ls -la Shuru.ipa

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shuru-ipa
          path: Shuru.ipa

      - name: Publish "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Shuru.ipa \
            --title "Shuru (latest build)" \
            --notes "Unsigned build of commit ${GITHUB_SHA::7}. Install it with SideStore, AltStore or LiveContainer, which sign it with your own Apple ID." \
            --target "$GITHUB_SHA"
